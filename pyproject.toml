# La libreria ST-language (cartella st_language/): la notazione di SoundText
# usabile da sola, con i comandi st-language, stcheck, st2mid, st2musicxml,
# st2abc e st2mtxt. SoundText, l'applicazione, sta nel repository
# openssound/soundtext.
#
#     pip install st-language       # da PyPI
#     pip install .                 # oppure dalla cartella del repository
#     st-language check brano.st
#
# Come si pubblica una versione: .github/workflows/publish-pypi.yml (tag st-language-vX.Y.Z).

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "st-language"
version = "2.8.0"
description = "ST-language: text music notation (notes, chords, drums, voices, lyrics) with MIDI, MusicXML, ABC and MTXT export"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "Sergio Scolaro"}]
keywords = ["music", "notation", "midi", "musicxml", "abc", "mtxt", "text", "chords", "lilypond"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
    "Topic :: Text Processing :: Markup",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/openssound/st-language"
Specification = "https://github.com/openssound/st-language/blob/main/docs/spec/ST-language.md"
Changelog = "https://github.com/openssound/st-language/blob/main/docs/spec/ST-language.md#appendix-a-changes"
Issues = "https://github.com/openssound/st-language/issues"

[project.scripts]
st-language = "st_language.cli:main"
stcheck = "st_language.cli:check_main"
st2mid = "st_language.cli:midi_main"
st2musicxml = "st_language.cli:musicxml_main"
st2abc = "st_language.cli:abc_main"
st2mtxt = "st_language.cli:mtxt_main"

[tool.setuptools]
packages = ["st_language"]
include-package-data = false

[tool.setuptools.package-data]
st_language = ["locales/*.json"]
